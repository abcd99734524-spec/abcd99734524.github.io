<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SCENE 01 | Your Digital Day</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <p class="site-logo">TOO MUCH INFORMATION!</p>
    <div class="scene-indicator"><span>SCENE 01 / 05</span><span class="menu-mark" aria-hidden="true"></span></div>
  </header>
  <main class="digital-day-section" id="scene-01" data-state="initial">
    <div class="scene-layout">
      <div class="question-panel">
        <section class="intro" aria-labelledby="scene-title">
          <p class="eyebrow">01 / YOUR DIGITAL DAY</p>
          <h1 id="scene-title">오늘 스마트폰을<br>얼마나 사용했나요?</h1>
          <p class="intro-description">우리는 하루 중 얼마나 많은 시간을 화면과 함께 보낼까요?</p>
        </section>
        <form class="usage-form" id="usage-form">
          <fieldset class="age-selector">
            <legend>STEP 01. 연령대를 선택해주세요.</legend>
            <div class="age-options">
              <label class="age-option"><input type="radio" name="age" value="10" data-age="10"><span>10대</span></label>
              <label class="age-option"><input type="radio" name="age" value="20" data-age="20"><span>20대</span></label>
              <label class="age-option"><input type="radio" name="age" value="30" data-age="30"><span>30대</span></label>
              <label class="age-option"><input type="radio" name="age" value="40" data-age="40"><span>40대</span></label>
              <label class="age-option"><input type="radio" name="age" value="50-plus" data-age="50-plus"><span>50대+</span></label>
            </div>
          </fieldset>
          <div class="time-selector">
            <label for="usage-time">STEP 02. 하루 스마트폰 사용시간은?</label>
            <div class="select-wrap">
              <select id="usage-time" name="usageTime">
                <option value="" disabled selected>사용시간을 선택해주세요</option>
                <!-- 임시 시간 구간: 실제 기획에 맞게 수정하세요. -->
                <option value="under-1">1시간 미만</option>
                <option value="1-2">1~2시간</option>
                <option value="2-3">2~3시간</option>
                <option value="3-4">3~4시간</option>
                <option value="4-5">4~5시간</option>
                <option value="5-plus">5시간 이상</option>
              </select>
            </div>
          </div>
          <!-- JavaScript 연결 전에는 결과 버튼을 비활성 상태로 유지합니다. -->
          <button class="result-button" id="result-button" type="button" disabled><span>결과 확인하기</span><span aria-hidden="true">↗</span></button>
        </form>
      </div>
      <aside class="feedback-panel" id="feedback-panel" aria-labelledby="feedback-title" aria-live="polite">
        <p class="panel-label">YOUR DIGITAL DAY</p>
        <div class="panel-value" id="feedback-value">?</div>
        <section class="result-card" id="result-card" hidden
         aria-labelledby="result-card-title">
  <h3 id="result-card-title"></h3>

  <p class="result-stat-label">
    하루 4시간 이상 사용하는 사람의 비율 · 가상 데이터
  </p>

  <p class="result-rate" id="result-rate"></p>

  <div class="result-bar" id="result-bar"
       role="meter"
       aria-label="하루 4시간 이상 사용하는 사람의 비율"
       aria-valuemin="0"
       aria-valuemax="100">
    <span id="result-bar-fill"></span>
  </div>

  <p class="result-average" id="result-average"></p>
</section>
        <h2 id="feedback-title">당신의 하루는?</h2>
        <p class="panel-description" id="feedback-description">연령대와 사용시간을 선택하면 관련 통계를 확인할 수 있어요.</p>
        <p class="panel-status" id="feedback-status">WAITING FOR INPUT...</p>
      </aside>
    </div>
    <div class="scene-progress" role="progressbar" aria-label="전체 장면 진행" aria-valuemin="0" aria-valuemax="5" aria-valuenow="1"><span></span></div>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
